server:
  port: ${PORT:8088}

spring:
  application:
    name: playground-service

  datasource:
    url: ${PLAYGROUND_DB_URL}
    username: ${PLAYGROUND_DB_USERNAME}
    password: ${PLAYGROUND_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

jwt:
  secret: ${JWT_SECRET}


judge0:
  base-url: ${JUDGE0_BASE_URL:https://ce.judge0.com}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

  endpoint:
    health:
      show-details: always